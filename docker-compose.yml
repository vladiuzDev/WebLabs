services:
  mongo:
    image: mongo:6
    container_name: weblab-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - weblab_mongo:/data/db
    networks:
      - weblab_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: weblab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - weblab_redis:/data
    networks:
      - weblab_network
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: weblab-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4200:4200"
    networks:
      - weblab_network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  weblab_mongo:
  weblab_redis:

networks:
  weblab_network:
