services:
  postgres:
    image: postgres:16
    container_name: weblab-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - weblab_postgres:/var/lib/postgresql/data
    networks:
      - weblab_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: weblab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - weblab_redis:/data
    networks:
      - weblab_network
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: weblab-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4200:4200"
    networks:
      - weblab_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  weblab_postgres:
  weblab_redis:

networks:
  weblab_network:
